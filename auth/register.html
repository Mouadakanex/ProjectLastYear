<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="resgiter.css">
</head>
<body>
    <header>
        <div class="Container">
            <div class="Container-header">
                 <img class="logo" src="Movite-logo-removebg-preview.png" alt="">

            <div class="Context">
                <h1>Welcome To Movite</h1>
            <p>Create Your Acoount Here</p>
            </div>
            
            <div class="form-field">
                <input id="username" type="text" placeholder=" ">
                <label class="user" for="username">username</label>
            </div>
            <div class="form-field">
                <input id="email" type="email" placeholder=" ">
                <label class="email" for="email">email</label>
            </div>
            <div class="form-field">
                <input id="password" type="password" placeholder=" ">
                <label class="pass" for="password">password</label>
            </div>
            <div class="form-field">
                <input id="confirm-password" type="password" placeholder=" ">
                <label class="cfpass" for="confirm-password">confirme password</label>
            </div>

            <button type="submit">Sign in</button>
            </div>  
           
        </div>
    </header>
</body>
</html>
