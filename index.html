<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container container-header">
            <img
                src="Movite-logo-removebg-preview.png"
                alt="MoVito Logo"
                class="logo">
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Browse</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

            <div class="search-box">
                <span class="search-ico">⌕</span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search products..."
                    autocomplete="off"
                >
            </div>

            <div class="Btnholics">
                <a href="so9.html">
                    Back To Market
                </a>
            </div>

        </div>
    </header>

    <main>
        <section class="Products">
        <div class="prods">
            <div class="Context">
                <h2>List your product</h2>
                <p>Fill in the details, the AI helper on the side will guide you at every step.
                </p>
            </div>
           


            <form action="">
                <label for="">Product Name</label>
                <input id="productName" type="text" placeholder="Product Name">

                <label for="">Product Price</label>
                <input id="productPrice" type="number" placeholder="Ex:6500" required>

                <label for="">Product Image</label>
                <input
                type="text"
                id="productImage"
                placeholder="Image URL"
                >

                <label for="productCategory">Category</label>

                <select id="productCategory">
                    <option value="">Category</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Electro">Electro</option>
                    <option value="Games">Games</option>
                </select>
                
                
                <label for="productDescription">Description</label>
                
                <textarea
                    id="productDescription"
                    cols="30"
                    rows="10"
                    placeholder="Add Your Description">
                </textarea>
                
                <button id="addProductBtn"> Publish Product </button>
            </form>
        </div>
    </section>
    </main>

    <script src="sell.js"></script>

</body>
</html>
